name: CI & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Lint JavaScript
        run: npx eslint .

      - name: Run tests
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build-test-lint
    if: github.ref == 'refs/heads/main'  # only deploy from main branch

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate deployment build information
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          DEPLOYED_AT="$(date -u +'%Y-%m-%d %H:%M UTC')"
          printf 'globalThis.CALENDAR_BUILD_INFO = { sha: "%s", deployedAt: "%s" };\n' "$BUILD_SHA" "$DEPLOYED_AT" > js/build-meta.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./  # root of repo; adjust if you have a build folder